# AWS CodeBuild: builds the image natively on ARM and pushes <IMAGE_TAG> and latest to ECR.
# Started by scripts/codebuild-release.sh, which passes IMAGE_TAG, ECR_REGISTRY, ECR_REPO and EXPECTED_ARCH.
version: 0.2

env:
  variables:
    NODE_IMAGE: "public.ecr.aws/docker/library/node:26-alpine"
    EXPECTED_ARCH: "arm64"

phases:
  pre_build:
    commands:
      - test -n "$IMAGE_TAG" && test -n "$ECR_REGISTRY" && test -n "$ECR_REPO"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - IMAGE="$ECR_REGISTRY/$ECR_REPO"
      - docker build --build-arg NODE_IMAGE="$NODE_IMAGE" -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
      - ARCH=$(docker image inspect --format '{{.Architecture}}' "$IMAGE:$IMAGE_TAG")
      - echo "Image architecture $ARCH"
      - test "$ARCH" = "$EXPECTED_ARCH"
      - docker push "$IMAGE:$IMAGE_TAG"
      - docker push "$IMAGE:latest"
